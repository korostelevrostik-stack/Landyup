<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Адвокат Дьявола</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <!-- ERUDA ДЛЯ ОТЛАДКИ НА ТЕЛЕФОНЕ -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <!-- ========== ЭКРАН РЕГИСТРАЦИИ ========== -->
    <div id="auth-screen">
        <div id="auth-box">
            <h1>👿 Адвокат Дьявола</h1>
            <p class="subtitle">Создай аккаунт, чтобы судить души</p>

            <div class="auth-field">
                <label>👤 Имя</label>
                <input type="text" id="auth-name" placeholder="Введи имя" maxlength="20">
            </div>

            <div class="auth-field">
                <label>🔒 Пароль</label>
                <input type="password" id="auth-password" placeholder="Придумай пароль" maxlength="30">
            </div>

            <div class="auth-field">
                <label>⚧ Пол</label>
                <div id="auth-gender">
                    <button class="gender-btn" data-gender="male">👨 Мужской</button>
                    <button class="gender-btn" data-gender="female">👩 Женский</button>
                    <button class="gender-btn" data-gender="other">🤖 Другой</button>
                </div>
                <input type="hidden" id="auth-gender-value" value="">
            </div>

            <button id="auth-btn">🚀 Войти / Создать</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- ========== ЭКРАН ИГРЫ ========== -->
    <div id="game-screen" style="display:none;">

        <div id="top-panel">
            <div id="top-left">
                <span id="player-name">👤 Игрок</span>
                <span id="player-gender"></span>
            </div>
            <div id="arrows">
                <button id="btn-heaven" class="arrow heaven">⬆️ В РАЙ</button>
                <button id="btn-hell" class="arrow hell">⬇️ В АД</button>
            </div>
            <div id="info">
                <span id="timer">⏳ 7</span>
                <span id="coins">🪙 0</span>
            </div>
        </div>

        <div id="scene-container">
            <div id="soul-container">
                <div id="soul-halo">✨</div>
                <div id="soul">👻</div>
                <div id="soul-face">◕‿◕</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
                <div class="particle">✦</div>
            </div>
        </div>

        <div id="hint">Нажми стрелку, чтобы начать суд</div>
    </div>

    <!-- ========== СКРИПТЫ ========== -->
    <script src="scripts/auth.js"></script>
    <script src="scripts/souls.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/game.js"></script>
</body>
</html>
